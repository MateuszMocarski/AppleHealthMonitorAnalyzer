# Example profile that makes short sleep more costly than oversleeping.
# Only the values listed here override application defaults.

[sleep.score.duration]
target_minutes = 480
tolerance_minutes = 20
undersleep_weight = 1.5
oversleep_weight = 0.5

[sleep.score.weights]
bedtime = 1.0
duration = 2.0
wake_up = 1.0
