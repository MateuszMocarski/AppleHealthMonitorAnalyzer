[project]
name = "AppleHealthMonitorAnalyzer"
version = "0.1.0"
description = "Apple Health export analyzer"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.116.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "uvicorn>=0.35.0",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "black",
    "build",
    "httpx",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["apple_health*"]

[tool.setuptools.package-data]
"apple_health.api" = [
    "web/*.html",
    "web/*.svg",
]
"apple_health.config" = [
    "examples/*.toml",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]