[project]
name = "connected-health-analyzer"
version = "0.1.0"
description = "Connected Health Analyzer for Apple Health exports"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "fastapi==0.141.1",
    "httpx2==2.13.1",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
dev = [
    "black==26.5.1",
    "build==1.6.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
]

[tool.setuptools.packages.find]
include = ["connected_health*"]

[tool.setuptools.package-data]
"connected_health.api" = [
    "web/*.html",
    "web/*.svg",
]
"connected_health.config" = [
    "examples/*.toml",
]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
