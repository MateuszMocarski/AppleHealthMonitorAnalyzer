[project]
name = "AppleHealthMonitorAnalyzer"
version = "0.1.0"
description = "Apple Health export analyzer"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "tomli>=2.0.0; python_version < '3.11'",
]

[tool.setuptools.packages.find]
include = ["apple_health*"]
exclude = ["exports*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]