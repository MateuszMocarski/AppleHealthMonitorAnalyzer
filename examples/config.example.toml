# Complete example configuration.
# All values below match the current application defaults.
# You may remove any setting you do not want to override.

[source]
apple_watch_source = "Apple Watch"
apple_health_app_source = "Zdrowie"

[sleep]
session_gap_threshold_minutes = 30

[sleep.score]
linear_penalties = false

[sleep.score.bedtime]
target = "00:00"
penalty_interval_minutes = 15
penalty_points = 5.0

[sleep.score.duration]
target_minutes = 480
tolerance_minutes = 30
penalty_interval_minutes = 15
penalty_points = 5.0
oversleep_weight = 1.0
undersleep_weight = 1.0

[sleep.score.wake_up]
target = "08:00"
bedtime_weight = 1.0
duration_weight = 2.0
penalty_interval_minutes = 15
penalty_points = 3.0

[sleep.score.weights]
bedtime = 1.0
duration = 1.0
wake_up = 1.0

[sleep.score.monthly_bonus]
enabled = true
max_points = 20

average_thresholds = [
    [90, 15],
    [80, 10],
    [70, 5],
]

consistency_thresholds = [
    [3, 5],
    [6, 4],
    [9, 3],
    [12, 2],
    [15, 1],
]
